<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFB Picks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="stylesheet" href="style.css?v=202610201200">
</head>
<body>
  <header>
    <div class="top">
      <h1>🏈 <span class="name">CFB Picks</span></h1>
      <div class="week-nav">
        <button id="prevWeek" aria-label="Previous week">◀</button>
        <span id="weekLabel">Week</span>
        <button id="nextWeek" aria-label="Next week">▶</button>
      </div>
      <div class="top-right">
        <button id="syncBadge" class="chip-btn" title="Saving">☁</button>
        <button id="helpBtn" class="chip-btn" title="How to use this site">?</button>
      </div>
    </div>
    <nav>
      <button class="tab active" data-tab="week">This Week</button>
      <button class="tab" data-tab="standings">Standings</button>
      <button class="tab" data-tab="more">More</button>
    </nav>
  </header>

  <div id="toast" role="status"></div>

  <main>
    <section id="week" class="panel"></section>
    <section id="standings" class="panel hidden"></section>
    <section id="more" class="panel hidden"></section>
  </main>

  <template id="helpTpl">
    <div class="help">
      <h4>Each week</h4>
      <ol>
        <li><strong>This Week</strong> → paste the pool email → <em>Import</em>.</li>
        <li>Tap Ron's picks: one team and Over/Under for each game, Over/Under for each question, and the combined score.</li>
        <li>Claude's picks show under each game once Chad has run Claude's research.</li>
        <li>Tap <em>Copy reply</em> and paste it into the email back to the pool. Picks lock Friday at noon (Pacific).</li>
        <li>Scores and results fill in by themselves after the games.</li>
      </ol>
      <h4>Standings</h4>
      <ol>
        <li>Copy the whole league sheet for the week (game headers through the last player).</li>
        <li><strong>Standings</strong> → <em>Add the league's picks</em> → paste → <em>Import</em>.</li>
      </ol>
      <p>Use ◀ ▶ at the top to change weeks.</p>
      <h4>First time on a phone or computer</h4>
      <p>Open the link Chad sends you. The ☁ at the top turns green when your picks are saved online (the same on every device).</p>
    </div>
  </template>
  <script>
    // Instructions popup: self-contained so it always works.
    document.getElementById("helpBtn").addEventListener("click", function () {
      if (document.querySelector(".overlay")) return;
      var o = document.createElement("div"); o.className = "overlay";
      var box = document.createElement("div"); box.className = "dialog";
      var head = document.createElement("div"); head.className = "dialog-head";
      var h = document.createElement("h3"); h.textContent = "How to use CFB Picks";
      var x = document.createElement("button"); x.textContent = "✕"; x.className = "chip-btn";
      head.append(h, x); box.append(head, document.getElementById("helpTpl").content.firstElementChild.cloneNode(true)); o.append(box);
      function close() { o.remove(); document.removeEventListener("keydown", esc); }
      function esc(e) { if (e.key === "Escape") close(); }
      x.addEventListener("click", close); o.addEventListener("click", function (e) { if (e.target === o) close(); });
      document.addEventListener("keydown", esc); document.body.append(o);
    });
  </script>
  <script src="logic.js?v=202610201200"></script>
  <script src="store.js?v=202610201200"></script>
  <script src="app.js?v=202610201200"></script>
</body>
</html>
